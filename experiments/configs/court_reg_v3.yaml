run_name: court_reg_v3

video:
  path: .local/data/real/videos/pickle_vid_1_trimmed_from_8s.mp4

annotations:
  path: docs/annotations/real/anchors/annotations_v3.json

stabilizer:
  n_features: 4000
  ratio_test: 0.75
  min_matches: 15
  ransac_threshold_px: 4.0
  transform_type: post_translation   # current best simple tracker on this clip
  rolling_reference: false
  max_translation_px: 80.0
  max_rotation_deg:
  max_scale_dev:
  top_mask_frac: 0.18          # mask top background
  bottom_mask_frac: 0.10       # mask bottom player-heavy area
  roi:
    enabled: true
    fill_court: false          # line neighborhoods are stabler than the full court interior
    expand_scale_x: 1.08       # slightly wider than annotated kitchen quad
    expand_scale_y: 1.18       # include a little net-adjacent area
    line_band_px: 44           # focus on painted lines and net-adjacent structure
    court_padding_px: 12       # small buffer around the line bands
  translation_tracker:
    annotations_path: docs/annotations/real/anchors/annotations_v2.json
    anchor_name: net_base_center
    template_half_size_px: 24
    search_radius_px: 36
    use_previous_match: true
    min_score: 0.55

refinement:
  enabled: false
  search_px: 15                # ±15px perpendicular search around predicted line
  n_sample_points: 40          # points sampled along each kitchen line

output:
  results_dir: results/real_baseline/
  save_overlay_video: true
  overlay_video_fps: 10.0
  overlay_video_scale: 0.5
  overlay_frame_step: 6
  debug_frame_indices: [0, 60, 300, 600, 1200, 2000]
  draw_anchors: true           # show anchor dots in debug frames

validation:
  n_sample_frames: 60          # frames for edge-strength + anchor drift report
  reprojection_labels_path: docs/annotations/real/anchors/reprojection_labels_v1.json

comparison_exports:
  enabled: true
