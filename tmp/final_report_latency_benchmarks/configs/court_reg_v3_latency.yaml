run_name: latency_court_reg_v3_post_translation
video:
  path: data/real/videos/pickle_vid_1_trimmed_from_8s.mp4
annotations:
  path: data/real/annotations/annotations_v3.json
stabilizer:
  n_features: 4000
  ratio_test: 0.75
  min_matches: 15
  ransac_threshold_px: 4.0
  transform_type: post_translation
  rolling_reference: false
  max_translation_px: 80.0
  max_rotation_deg: null
  max_scale_dev: null
  top_mask_frac: 0.18
  bottom_mask_frac: 0.1
  roi:
    enabled: true
    fill_court: false
    expand_scale_x: 1.08
    expand_scale_y: 1.18
    line_band_px: 44
    court_padding_px: 12
  translation_tracker:
    annotations_path: data/real/annotations/annotations_v2.json
    anchor_name: net_base_center
    template_half_size_px: 24
    search_radius_px: 36
    use_previous_match: true
    min_score: 0.55
refinement:
  enabled: false
  search_px: 15
  n_sample_points: 40
output:
  results_dir: /Users/robert/dev/git/school/kitchen-master/kitchen-master/tmp/final_report_latency_benchmarks/results
  save_overlay_video: true
  overlay_video_fps: 10.0
  overlay_video_scale: 0.5
  overlay_frame_step: 6
  debug_frame_indices:
  - 0
  - 60
  - 300
  - 600
  - 1200
  - 2000
  draw_anchors: true
validation:
  n_sample_frames: 60
  reprojection_labels_path: data/real/annotations/reprojection_labels_v1.json
comparison_exports:
  enabled: false
