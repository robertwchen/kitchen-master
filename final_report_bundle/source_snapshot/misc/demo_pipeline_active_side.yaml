run_name: demo_v1_active_side
video:
  path: data/real/videos/pickle_vid_1_trimmed_from_8s.mp4
registration:
  csv_path: results/real_baseline/court_reg_v3/per_frame_transforms.csv
  annotations_path: data/real/annotations/annotations_v3.json
ball_tracking:
  enabled: true
  detection_mode: diff_and_hsv
  hsv_lower:
  - 18
  - 60
  - 160
  hsv_upper:
  - 55
  - 255
  - 255
  diff_threshold: 18
  diff_dilate_k: 8
  min_area: 60.0
  max_area: 800.0
  min_circularity: 0.45
  min_v_at_centroid: 170
  top_exclude_frac: 0.12
  morph_open_k: 1
  morph_close_k: 3
  max_jump_px: 260.0
  smooth_sigma: 1.0
  trail_length: 12
  write_overlay: true
  overlay_fps: 10.0
  overlay_scale: 0.5
  debug_every_n: 60
volley_classification:
  enabled: true
  smooth_sigma: 2.0
  min_drop_px: 8.0
  min_rise_px: 8.0
  court_y_band_px: 120.0
  lookback_frames: 5
  lookahead_frames: 5
  uncertain_margin_px: 20.0
  hit_lookback_frames: 30
  min_bounce_confidence: 0.3
  montage_context_frames: 5
  montage_scale: 0.4
  hit_frames: []
foot_localizer:
  mode: event_hybrid
  temporal_window_radius: 1
  temporal_sigma_frames: 1.0
  min_temporal_support: 2
  low_confidence_threshold: 0.45
  min_blob_area: 150.0
  expected_foot_area: 2000.0
  boundary_pad_x: 180
  boundary_pad_y: 150
  near_bottom_bonus_px: 110
  boundary_distance_sigma_px: 45.0
  min_solidity: 0.08
  bg_history: 32
  bg_var_threshold: 30.0
  morph_open_k: 3
  morph_close_k: 7
  combined_open_k: 3
  combined_close_k: 9
  roi:
    x0: 0
    y0: 520
    x1: 1920
    y1: 1080
  threshold_mode: value
  gray_threshold: 92
foot_fault:
  enabled: true
  nvz_side: left
  fault_threshold_px: 5.0
  uncertain_margin_px: 15.0
  manual_volley_frames:
  - 929
  - 1537
  - 1948
pipeline:
  mode: auto_review
  review_pending_path: results/presentation_demo/demo_v1_active_side/review/review_pending.json
  review_approved_path: results/presentation_demo/demo_v1_active_side/review/review_approved.json
output:
  results_dir: results/presentation_demo/
  show_court_overlay: true
  show_ball_trail: true
  write_summary_video: true
  summary_video_fps: 10.0
  summary_video_scale: 0.5
